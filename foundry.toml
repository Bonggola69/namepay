[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
# bsc-dataseed1.binance.org does NOT serve historical state (eth_call at a
# pinned block ~400 behind head fails with "missing trie node"), so the fork
# test pins its block against publicnode, which serves archive state.
bsc = "https://bsc.publicnode.com"
bsc_dataseed1 = "https://bsc-dataseed1.binance.org"
